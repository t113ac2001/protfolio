<!DOCTYPE html>
<html lang="zh-Hant" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>插畫系列 ★</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;900&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Syne', 'sans-serif'],
            mono: ['Space Grotesk', 'monospace']
          },
          colors: {
            cblue: {
              DEFAULT: '#002BFF',
              dark: '#001489',
              light: '#E0E7FF',
              sky: '#93C5FD'
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #002BFF;
      color: #ffffff;
      font-family: 'Space Grotesk', sans-serif;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    .bg-grid-pattern {
      background-size: 32px 32px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
    }
    .tag-box {
      border: 1px solid #ffffff;
      background: rgba(0, 43, 255, 0.85);
      backdrop-filter: blur(4px);
      padding: 2px 8px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: inline-block;
      box-shadow: 2px 2px 0px #ffffff;
    }
    .tag-box-white {
      border: 1px solid #002BFF;
      background: #ffffff;
      color: #002BFF;
      padding: 2px 8px;
      font-size: 0.75rem;
      font-weight: bold;
      display: inline-block;
      box-shadow: 2px 2px 0px #001489;
    }
    .gallery-card {
      background: #ffffff;
      border: 3px solid #ffffff;
      box-shadow: 8px 8px 0px #001489;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .gallery-card:hover {
      transform: translateY(-4px);
      box-shadow: 12px 12px 0px #ffffff;
    }
    .star-particle {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      animation: flyStar 1s ease-out forwards;
    }
    @keyframes flyStar {
      0% { transform: translate(-50%, -50%) scale(0) rotate(0deg); opacity: 1; }
      50% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.3) rotate(180deg); opacity: 0.9; }
      100% { transform: translate(calc(-50% + var(--dx) * 1.5), calc(-50% + var(--dy) * 1.5)) scale(0) rotate(360deg); opacity: 0; }
    }
  </style>
</head>

<body class="bg-grid-pattern min-h-screen relative selection:bg-white selection:text-cblue">

  <!-- 頂部導航 -->
  <header class="max-w-7xl mx-auto px-6 py-6 flex items-center justify-between relative z-40 border-b-2 border-white/20">
    <div class="flex items-center gap-3">
      <a href="index.html" class="tag-box-white flex items-center gap-2 hover:bg-cblue hover:text-white transition-colors">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> BACK TO PORTFOLIO
      </a>
    </div>

    <div class="tag-box text-xs font-mono font-bold">
      ILLUSTRATION  ★
    </div>
  </header>

  <!-- 頁面標題區 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-12">
    <div class="flex flex-col md:flex-row md:items-end justify-between border-b-2 border-white pb-6 mb-8 gap-4">
      <div>
        <div class="flex items-center gap-2 text-blue-200 text-xs font-mono mb-2">
          <span>// ILLUSTRATION ARCHIVE</span>
          <span>✦✦✦</span>
        </div>
        <h1 class="text-4xl sm:text-6xl font-display font-black text-white">插畫作品</h1>
      </div>
      <div class="text-left md:text-right">
        <span class="tag-box-white text-xs font-bold" id="gallery-total-count">0 ARTWORKS</span>
        <p class="text-blue-100 text-xs mt-1 font-sans">
          點擊任意圖片即可開啟全螢幕相片檢視器。
        </p>
      </div>
    </div>

    <!-- 插畫作品列表 -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="gallery-grid"></div>
  </main>

  <!-- 左右切換式大圖燈箱 -->
  <div id="img-modal" class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6 bg-cblue/90 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300" onclick="closePreview()">
    <div class="relative max-w-4xl w-full bg-white border-4 border-white shadow-[12px_12px_0px_#000] p-4 sm:p-6 text-cblue" onclick="event.stopPropagation()">
      
      <!-- 頂部資訊列 -->
      <div class="flex items-center justify-between border-b-2 border-cblue pb-3 mb-4">
        <div class="flex items-center gap-2">
          <span id="preview-index" class="tag-box-white text-[11px]">FIG. 01 / 05</span>
          <span class="text-xs font-mono uppercase font-bold text-gray-500">GALLERY VIEWER</span>
        </div>
        <button onclick="closePreview()" class="tag-box hover:bg-cblue hover:text-white transition-colors text-xs font-bold flex items-center gap-1 cursor-pointer">
          ✕ CLOSE [ESC]
        </button>
      </div>

      <!-- 圖片展示區 -->
      <div class="relative w-full h-[55vh] sm:h-[65vh] bg-cblue border-2 border-cblue overflow-hidden flex items-center justify-center group">
        <img id="preview-src" src="" alt="Full Preview" class="w-full h-full object-contain select-none" />

        <!-- 上一張按鈕 -->
        <button onclick="prevImage(event)" class="absolute left-2 sm:left-4 top-1/2 -translate-y-1/2 bg-white text-cblue border-2 border-cblue p-2.5 sm:p-3 font-black shadow-[3px_3px_0px_#001489] hover:scale-110 active:translate-x-1 transition-all z-20 cursor-pointer" title="上一張 (←)">
          <i data-lucide="chevron-left" class="w-5 h-5 sm:w-6 sm:h-6"></i>
        </button>

        <!-- 下一張按鈕 -->
        <button onclick="nextImage(event)" class="absolute right-2 sm:right-4 top-1/2 -translate-y-1/2 bg-white text-cblue border-2 border-cblue p-2.5 sm:p-3 font-black shadow-[3px_3px_0px_#001489] hover:scale-110 active:translate-x-1 transition-all z-20 cursor-pointer" title="下一張 (→)">
          <i data-lucide="chevron-right" class="w-5 h-5 sm:w-6 sm:h-6"></i>
        </button>
      </div>

      <!-- 底部作品說明 切換鍵 -->
      <div class="mt-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 pt-2">
        <div>
          <h3 class="font-display font-black text-xl" id="preview-title">作品標題</h3>
          <p class="text-xs text-gray-600 font-mono mt-0.5" id="preview-desc">PROCREATE / DIGITAL ART</p>
        </div>
        <div class="flex gap-2">
          <button onclick="prevImage(event)" class="px-4 py-2 bg-cblue text-white font-bold text-xs uppercase tracking-wider hover:bg-[#001489] transition-colors border border-cblue cursor-pointer">
            ◀ PREV
          </button>
          <button onclick="nextImage(event)" class="px-4 py-2 bg-cblue text-white font-bold text-xs uppercase tracking-wider hover:bg-[#001489] transition-colors border border-cblue cursor-pointer">
            NEXT ▶
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 預設插畫相片資料
    const artworks = [
      {
        id: 'init_1',
        src: '未命名-8_工作區域 1 複本.jpg',
        title: '2026TXT演唱會應援團隊角色插畫',
        desc: 'PROCREATE'
      },
      {
        id: 'init_2',
        src: '未命名-8_工作區域 1 複本 4.jpg',
        title: '2026TXT演唱會應援團隊角色插畫',
        desc: 'PROCREATE'
      },
      {
        id: 'init_3',
        src: '未命名-8_工作區域 1 複本 2.jpg',
        title: '2026TXT演唱會應援團隊角色插畫',
        desc: 'PROCREATE'
      },
      {
        id: 'init_4',
        src: '未命名的作品.jpeg',
        title: '2026TXT演唱會應援團隊角色插畫',
        desc: 'PROCREATE'
      },
      {
        id: 'init_5',
        src: '未命名的作品 83.jpeg',
        title: '2026TXT演唱會應援團隊角色插畫',
        desc: 'PROCREATE'
      },
      {
        id: 'init_5',
        src: '未命名的作品 12.jpg',
        title: 'D.O. DUMB 插畫',
        desc: 'PROCREATE'
      },
      {
        id: 'init_5',
        src: '未命名的作品 15.jpg',
        title: '裴珍映插畫',
        desc: 'PROCREATE'
      },
      {
        id: 'init_5',
        src: 'IMG_6618.jpg',
        title: '應援集資禮插畫',
        desc: 'PROCREATE'
      },
       {
        id: 'init_5',
        src: '未命名的作品 13.jpg',
        title: '一顆檸檬',
        desc: 'PROCREATE'
      }
    ];

    let currentImgIndex = 0;

    // 卡片
    function renderGallery() {
      const grid = document.getElementById('gallery-grid');
      const totalCount = document.getElementById('gallery-total-count');
      totalCount.innerText = `${artworks.length} ARTWORKS`;
      grid.innerHTML = '';

      artworks.forEach((art, idx) => {
        const card = document.createElement('div');
        card.className = 'gallery-card p-4 flex flex-col justify-between cursor-pointer group';
        card.onclick = () => openLightbox(idx);

        card.innerHTML = `
          <div class="h-64 sm:h-72 bg-cblue overflow-hidden border-2 border-cblue mb-4 relative">
            <img src="${art.src}" alt="${art.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
            <span class="absolute top-2 left-2 tag-box-white text-[10px]">FIG. 0${idx + 1}</span>
            <div class="absolute inset-0 bg-blue-900/10 group-hover:bg-transparent transition-colors"></div>
          </div>
          <div class="text-cblue">
            <h3 class="font-display font-black text-lg group-hover:text-blue-700 transition-colors">${art.title}</h3>
            <p class="text-xs text-gray-600 mt-1 font-mono">${art.desc || 'PROCREATE'}</p>
          </div>
        `;
        grid.appendChild(card);
      });
      lucide.createIcons();
    }

    // 燈箱瀏覽
    function openLightbox(index) {
      if (!artworks || artworks.length === 0) return;
      currentImgIndex = index;
      updateLightboxContent();
      const modal = document.getElementById('img-modal');
      modal.classList.remove('opacity-0', 'pointer-events-none');
    }

    function updateLightboxContent() {
      const art = artworks[currentImgIndex];
      document.getElementById('preview-src').src = art.src;
      document.getElementById('preview-title').innerText = art.title;
      document.getElementById('preview-desc').innerText = art.desc || 'PROCREATE';
      document.getElementById('preview-index').innerText = `FIG. 0${currentImgIndex + 1} / 0${artworks.length}`;
      lucide.createIcons();
    }

    function closePreview() {
      const modal = document.getElementById('img-modal');
      modal.classList.add('opacity-0', 'pointer-events-none');
    }

    function prevImage(e) {
      if (e) e.stopPropagation();
      if (!artworks || artworks.length === 0) return;
      currentImgIndex = (currentImgIndex - 1 + artworks.length) % artworks.length;
      updateLightboxContent();
    }

    function nextImage(e) {
      if (e) e.stopPropagation();
      if (!artworks || artworks.length === 0) return;
      currentImgIndex = (currentImgIndex + 1) % artworks.length;
      updateLightboxContent();
    }

    document.addEventListener('keydown', (e) => {
      const modal = document.getElementById('img-modal');
      if (modal && !modal.classList.contains('opacity-0')) {
        if (e.key === 'ArrowLeft') prevImage();
        if (e.key === 'ArrowRight') nextImage();
        if (e.key === 'Escape') closePreview();
      }
    });

    // 星星
    const starShapes = ['★', '✦', '✶', '✸', '✹'];
    function handleScreenTouch(clientX, clientY, target) {
      if (target && target.closest('#img-modal') && !target.closest('button')) return;
      spawnStar(clientX, clientY);
    }

    window.addEventListener('click', (e) => {
      if (e.detail === 0 && 'ontouchstart' in window) return;
      handleScreenTouch(e.clientX, e.clientY, e.target);
    });

    window.addEventListener('touchstart', (e) => {
      if (!e.touches || e.touches.length === 0) return;
      const touch = e.touches[0];
      handleScreenTouch(touch.clientX, touch.clientY, e.target);
    }, { passive: true });

    function spawnStar(x, y) {
      const count = 5;
      for (let i = 0; i < count; i++) {
        const star = document.createElement('div');
        star.className = 'star-particle text-white font-bold select-none pointer-events-none';
        star.innerText = starShapes[Math.floor(Math.random() * starShapes.length)];
        const angle = Math.random() * Math.PI * 2;
        const dist = 25 + Math.random() * 55;
        const dx = Math.cos(angle) * dist + 'px';
        const dy = Math.sin(angle) * dist + 'px';
        const size = 16 + Math.random() * 18 + 'px';

        star.style.setProperty('--dx', dx);
        star.style.setProperty('--dy', dy);
        star.style.left = `${x}px`;
        star.style.top = `${y}px`;
        star.style.fontSize = size;

        document.body.appendChild(star);
        setTimeout(() => star.remove(), 1000);
      }
    }

    renderGallery();
  </script>
</body>
</html>
