<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CMS ADMIN ★ PROJECT PUBLISHER</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;900&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #002BFF;
      color: #ffffff;
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
    }
    .bg-grid-pattern {
      background-size: 32px 32px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
    }
    .tag-box {
      border: 1px solid #ffffff;
      background: rgba(0, 43, 255, 0.85);
      padding: 2px 8px;
      font-size: 0.75rem;
      box-shadow: 2px 2px 0px #ffffff;
    }
    .tag-box-white {
      border: 1px solid #002BFF;
      background: #ffffff;
      color: #002BFF;
      padding: 2px 8px;
      font-size: 0.75rem;
      font-weight: bold;
      box-shadow: 2px 2px 0px #001489;
    }
    .collage-card {
      background: #ffffff;
      color: #002BFF;
      border: 3px solid #ffffff;
      box-shadow: 8px 8px 0px #001489;
    }
  </style>
</head>

<body class="bg-grid-pattern p-4 sm:p-8 flex items-center justify-center">

  <!-- 1. 密碼驗證彈窗 -->
  <div id="auth-screen" class="max-w-md w-full collage-card p-6 sm:p-8 relative">
    <div class="flex justify-between items-center border-b-2 border-[#002BFF] pb-3 mb-4">
      <span class="tag-box-white text-[10px]">ADMIN VERIFICATION</span>
      <span class="text-xl">★</span>
    </div>
    <h2 class="text-2xl font-black mb-2">管理員權限解鎖</h2>
    <p class="text-xs text-gray-600 mb-6">請輸入管理密碼</p>

    <form onsubmit="verifyPassword(event)">
      <label class="block text-xs font-bold uppercase mb-1">PASSWORD :</label>
      <input type="password" id="admin-pass" placeholder="請輸入密碼..." class="w-full p-3 border-2 border-[#002BFF] text-sm text-[#002BFF] font-bold focus:outline-none mb-4" />
      <p id="auth-err" class="text-xs text-red-600 font-bold mb-3 hidden">密碼錯誤，請重新輸入！</p>
      <button type="submit" class="w-full py-3 bg-[#002BFF] text-white font-black text-xs uppercase tracking-wider hover:bg-[#001489] transition-colors">
        [ 解鎖發布後台 ➔ ]
      </button>
    </form>
  </div>

  <!-- 2. 主發布介面 (解鎖後顯示) -->
  <div id="dashboard" class="max-w-6xl w-full hidden">
    
    <!-- 頂部功能列 -->
    <div class="flex items-center justify-between border-b-2 border-white pb-4 mb-8">
      <div class="flex items-center gap-3">
        <a href="index.html" class="tag-box-white flex items-center gap-1 hover:bg-[#002BFF] hover:text-white transition-colors">
          <i data-lucide="arrow-left" class="w-4 h-4"></i> 回首頁檢視
        </a>
        <span class="font-bold text-sm">// CREATIVE CMS PUBLISHER</span>
      </div>
      <button onclick="logout()" class="tag-box hover:bg-white hover:text-[#002BFF] transition-colors text-xs font-bold">
        ✕ 登出 LOCK
      </button>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      
      <!-- 左側：發布表單 (像 IG 發文一樣簡單) -->
      <div class="lg:col-span-7 collage-card p-6">
        <div class="border-b-2 border-[#002BFF] pb-3 mb-6 flex justify-between items-center">
          <h2 class="text-2xl font-black font-display">✨ 發布新作品 POST</h2>
          <span class="tag-box-white text-[10px]">NEW PROJECT</span>
        </div>

        <form id="project-form" onsubmit="publishProject(event)" class="space-y-4">
          <!-- 圖片上傳 -->
          <div>
            <label class="block text-xs font-bold uppercase mb-1">1. 上傳作品圖片 (支援相片檔案)</label>
            <input type="file" id="post-img-file" accept="image/*" onchange="handleImageUpload(event)" class="w-full text-xs text-gray-600 file:mr-4 file:py-2 file:px-4 file:border-0 file:text-xs file:font-bold file:bg-[#002BFF] file:text-white cursor-pointer border border-[#002BFF] p-2" />
          </div>

          <!-- 分類選擇 -->
          <div>
            <label class="block text-xs font-bold uppercase mb-1">2. 選擇所屬分類</label>
            <select id="post-category" onchange="updatePreview()" class="w-full p-2.5 border-2 border-[#002BFF] text-xs font-bold text-[#002BFF] focus:outline-none">
              <option value="ui">UI/UX 介面設計</option>
              <option value="branding">視覺設計</option>
              <option value="tech">插畫設計</option>
            </select>
          </div>

          <!-- 作品標題 -->
          <div>
            <label class="block text-xs font-bold uppercase mb-1">3. 作品標題</label>
            <input type="text" id="post-title" required oninput="updatePreview()" placeholder="例如：2026 演唱會主視覺海報" class="w-full p-2.5 border-2 border-[#002BFF] text-sm text-[#002BFF] font-bold focus:outline-none" />
          </div>

          <!-- 作品介紹 (文案) -->
          <div>
            <label class="block text-xs font-bold uppercase mb-1">4. 詳細介紹 (作品說明文案)</label>
            <textarea id="post-desc" rows="3" required oninput="updatePreview()" placeholder="輸入這件作品的設計理念、使用的工具或詳細說明..." class="w-full p-2.5 border-2 border-[#002BFF] text-xs text-[#002BFF] focus:outline-none font-sans"></textarea>
          </div>

          <!-- 標籤 Tags -->
          <div>
            <label class="block text-xs font-bold uppercase mb-1">5. 標籤 Tags (用半形逗號分開)</label>
            <input type="text" id="post-tags" oninput="updatePreview()" placeholder="Photoshop, Poster, Typography" class="w-full p-2.5 border-2 border-[#002BFF] text-xs text-[#002BFF] font-bold focus:outline-none" />
          </div>

          <!-- 外部跳轉連結 (選填) -->
          <div>
            <label class="block text-xs font-bold uppercase mb-1">6. 相關連結 / 網址 (選填，若有可填寫)</label>
            <input type="text" id="post-link" placeholder="例如：https://my-project.vercel.app" class="w-full p-2.5 border-2 border-[#002BFF] text-xs text-[#002BFF] font-bold focus:outline-none" />
          </div>

          <button type="submit" class="w-full py-4 bg-[#002BFF] text-white font-black text-sm uppercase tracking-wider hover:bg-[#001489] transition-all border-2 border-[#002BFF] shadow-[4px_4px_0px_#001489] mt-4 flex items-center justify-center gap-2">
            <i data-lucide="send" class="w-4 h-4"></i>
            <span>即刻發布至首頁 PUBLISH NOW</span>
          </button>
        </form>
      </div>

      <!-- 右側：即時卡片預覽 + 已發布作品管理 -->
      <div class="lg:col-span-5 space-y-6">
        
        <!-- 即時卡片預覽 -->
        <div class="collage-card p-5">
          <div class="flex justify-between items-center border-b border-[#002BFF]/30 pb-2 mb-3">
            <span class="text-xs font-bold uppercase text-gray-500">// LIVE PREVIEW (即時預覽)</span>
            <span class="tag-box-white text-[10px]">VER 2.0</span>
          </div>

          <div class="border-2 border-[#002BFF] p-4 bg-white">
            <div class="flex justify-between items-start mb-2">
              <span class="tag-box-white text-[10px]" id="prev-badge">UI/UX 介面</span>
              <span class="text-lg text-[#002BFF]">★</span>
            </div>
            <div class="h-44 bg-[#002BFF] text-white relative overflow-hidden mb-3 border border-[#002BFF] flex items-center justify-center">
              <img id="prev-img" src="" alt="Preview Image" class="w-full h-full object-cover hidden" />
              <div id="prev-placeholder" class="text-xs text-blue-200 font-mono">尚未選擇圖片</div>
            </div>
            <h3 class="text-lg font-black text-[#002BFF] leading-snug" id="prev-title">作品標題預覽</h3>
            <p class="text-xs text-gray-600 mt-1 line-clamp-2" id="prev-desc">這裡會顯示你的作品文案內容...</p>
            <div class="flex flex-wrap gap-1 mt-3" id="prev-tags">
              <span class="tag-box-white text-[9px]">#TAGS</span>
            </div>
          </div>
        </div>

        <!-- 已發布作品管理與刪除列表 -->
        <div class="collage-card p-5">
          <div class="flex justify-between items-center border-b border-[#002BFF]/30 pb-2 mb-3">
            <span class="text-xs font-bold uppercase text-gray-500">// ALL POSTS (作品清單管理)</span>
            <span class="text-xs font-bold text-[#002BFF]" id="items-count">0 件</span>
          </div>
          <div class="max-h-60 overflow-y-auto space-y-2 pr-1" id="manage-list"></div>
        </div>

      </div>

    </div>
  </div>

  <script>
    lucide.createIcons();

    const ADMIN_PASS = '2026'; // 後台解鎖密碼，可隨意修改
    let uploadedImageData = '';

    // 1. 驗證密碼
    function verifyPassword(e) {
      e.preventDefault();
      const pass = document.getElementById('admin-pass').value;
      if (pass === ADMIN_PASS) {
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        initDashboard();
      } else {
        document.getElementById('auth-err').classList.remove('hidden');
      }
    }

    function logout() {
      document.getElementById('dashboard').classList.add('hidden');
      document.getElementById('auth-screen').classList.remove('hidden');
      document.getElementById('admin-pass').value = '';
    }

    // 2. 處理圖片上傳轉為 Base64（存進 LocalStorage，純前端免伺服器）
    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        uploadedImageData = evt.target.result;
        updatePreview();
      };
      reader.readAsDataURL(file);
    }

    // 3. 即時同步右側預覽
    function updatePreview() {
      const title = document.getElementById('post-title').value || '作品標題預覽';
      const desc = document.getElementById('post-desc').value || '這裡會顯示你的作品文案內容...';
      const cat = document.getElementById('post-category').value;
      const tags = document.getElementById('post-tags').value;

      document.getElementById('prev-title').innerText = title;
      document.getElementById('prev-desc').innerText = desc;
      
      const catNames = { ui: 'UI/UX 介面', branding: '視覺設計', tech: '插畫設計' };
      document.getElementById('prev-badge').innerText = catNames[cat] || cat;

      const imgElem = document.getElementById('prev-img');
      const placeholder = document.getElementById('prev-placeholder');
      if (uploadedImageData) {
        imgElem.src = uploadedImageData;
        imgElem.classList.remove('hidden');
        placeholder.classList.add('hidden');
      } else {
        imgElem.classList.add('hidden');
        placeholder.classList.remove('hidden');
      }

      const tagsContainer = document.getElementById('prev-tags');
      tagsContainer.innerHTML = '';
      if (tags) {
        tags.split(',').forEach(t => {
          if (t.trim()) {
            const span = document.createElement('span');
            span.className = 'tag-box-white text-[9px]';
            span.innerText = '#' + t.trim();
            tagsContainer.appendChild(span);
          }
        });
      }
    }

    // 4. 發布作品
    function publishProject(e) {
      e.preventDefault();

      const newProject = {
        id: 'proj_' + Date.now(),
        title: document.getElementById('post-title').value.trim(),
        desc: document.getElementById('post-desc').value.trim(),
        category: document.getElementById('post-category').value,
        img: uploadedImageData || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80',
        tags: document.getElementById('post-tags').value.split(',').map(t => t.trim()).filter(Boolean),
        link: document.getElementById('post-link').value.trim(),
        date: new Date().toLocaleDateString()
      };

      const projects = JSON.parse(localStorage.getItem('my_portfolio_projects') || '[]');
      projects.unshift(newProject); // 新文章放最前面
      localStorage.setItem('my_portfolio_projects', JSON.stringify(projects));

      alert('🎉 作品發布成功！已同步至首頁！');
      document.getElementById('project-form').reset();
      uploadedImageData = '';
      updatePreview();
      renderManageList();
    }

    // 5. 管理與刪除現有作品
    function initDashboard() {
      renderManageList();
    }

    function renderManageList() {
      const projects = JSON.parse(localStorage.getItem('my_portfolio_projects') || '[]');
      const container = document.getElementById('manage-list');
      document.getElementById('items-count').innerText = `${projects.length} 件`;
      container.innerHTML = '';

      if (projects.length === 0) {
        container.innerHTML = '<p class="text-xs text-gray-500 py-2">目前尚無已發布之自訂專案。</p>';
        return;
      }

      projects.forEach(p => {
        const item = document.createElement('div');
        item.className = 'flex items-center justify-between p-2 border border-gray-200 text-xs bg-gray-50';
        item.innerHTML = `
          <div class="flex items-center gap-2 overflow-hidden pr-2">
            <img src="${p.img}" class="w-8 h-8 object-cover border border-[#002BFF] shrink-0" />
            <div class="truncate">
              <p class="font-bold text-[#002BFF] truncate">${p.title}</p>
              <p class="text-[10px] text-gray-500">${p.date || '剛剛'}</p>
            </div>
          </div>
          <button onclick="deleteProject('${p.id}')" class="text-red-600 hover:text-red-800 font-bold px-2 py-1 shrink-0">
            刪除 ✕
          </button>
        `;
        container.appendChild(item);
      });
    }

    function deleteProject(id) {
      if (!confirm('確定要從首頁刪除此專案嗎？')) return;
      let projects = JSON.parse(localStorage.getItem('my_portfolio_projects') || '[]');
      projects = projects.filter(p => p.id !== id);
      localStorage.setItem('my_portfolio_projects', JSON.stringify(projects));
      renderManageList();
    }
  </script>
</body>
</html>
